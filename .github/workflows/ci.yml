name: CI
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check production.py engine.py --output-format concise
      - name: Import sanity (fails if syntax or import broken)
        run: python -c "import production; import engine; print('imports OK')"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build base
        uses: docker/build-push-action@v5
        with: { context: ".", file: "Dockerfile.base", tags: "forte-base:ci", push: false }
      - name: Build app
        uses: docker/build-push-action@v5
        with: { context: ".", file: "Dockerfile", tags: "forte-api:ci", push: false }
